<!doctype html>
<html lang="cs">
<head>
<meta charset="utf-8">
<title>Dům 3D – benchmark</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #0b1a2e; font: 16px/1.4 system-ui, sans-serif; }
  canvas { display: block; width: 100vw; height: 100vh; }
  #hud { position: fixed; top: 12px; left: 12px; padding: 10px 14px; border-radius: 10px;
         background: rgba(0, 0, 0, .55); color: #e8f0ff; white-space: pre; font-family: ui-monospace, monospace; font-size: 14px; }
  #result { position: fixed; inset: 0; display: none; place-items: center; background: rgba(5, 12, 24, .85); color: #fff; }
  #result pre { font-size: 22px; line-height: 1.6; }
</style>
<script type="importmap">
  { "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.186.1/build/three.module.js" } }
</script>
</head>
<body>
<div id="hud">načítám…</div>
<div id="result"><pre></pre></div>
<script type="module">
// Benchmark scény ve stylu aplikace: low-poly dům, gradientová obloha, Lambert, bez stínů.
// Parametry URL: ?scale=0.75 (pevné rozlišení, bez auto testu) &aa=1 (MSAA) &trees=40
import * as THREE from 'three';

const params = new URLSearchParams(location.search);
const fixedScale = params.has('scale') ? Number(params.get('scale')) : null;
const antialias = params.get('aa') === '1';
const treeCount = Number(params.get('trees') ?? 40);
const STEPS = fixedScale ? [fixedScale] : [1, 0.75, 0.5];
const WARMUP_MS = 2000, MEASURE_MS = 8000;

const renderer = new THREE.WebGLRenderer({ antialias, powerPreference: 'high-performance' });
document.body.appendChild(renderer.domElement);
const gl = renderer.getContext();
const dbg = gl.getExtension('WEBGL_debug_renderer_info');
const glRenderer = gl.getParameter(dbg ? dbg.UNMASKED_RENDERER_WEBGL : gl.RENDERER);

renderer.domElement.addEventListener('webglcontextlost', (e) => {
  e.preventDefault();
  hud.textContent = 'WebGL context lost – obnovuji stránku…';
  setTimeout(() => location.reload(), 2000);
});

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(45, 1, 0.5, 500);

// Obloha: velká koule s vertikálním gradientem
scene.add(new THREE.Mesh(
  new THREE.SphereGeometry(300, 24, 12),
  new THREE.ShaderMaterial({
    side: THREE.BackSide, depthWrite: false,
    uniforms: { top: { value: new THREE.Color('#2f7fe0') }, bottom: { value: new THREE.Color('#cfe6ff') } },
    vertexShader: 'varying float h; void main(){ h = normalize(position).y; gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0); }',
    fragmentShader: 'uniform vec3 top; uniform vec3 bottom; varying float h; void main(){ gl_FragColor = vec4(mix(bottom, top, clamp(h * 1.6, 0.0, 1.0)), 1.0); }',
  }),
));

scene.add(new THREE.HemisphereLight('#dfefff', '#4a6b3a', 1.6));
const sun = new THREE.DirectionalLight('#fff4e0', 1.8);
sun.position.set(30, 50, 20);
scene.add(sun);

const lambert = (color) => new THREE.MeshLambertMaterial({ color, flatShading: true });

const ground = new THREE.Mesh(new THREE.CircleGeometry(80, 48), lambert('#7fae5a'));
ground.rotation.x = -Math.PI / 2;
scene.add(ground);

// Dům: tělo, střecha (trojboký hranol), okna
const house = new THREE.Group();
const body = new THREE.Mesh(new THREE.BoxGeometry(12, 6, 8), lambert('#f1ede4'));
body.position.y = 3;
const roofShape = new THREE.Shape([new THREE.Vector2(-4.6, 0), new THREE.Vector2(4.6, 0), new THREE.Vector2(0, 3.4)]);
const roofGeo = new THREE.ExtrudeGeometry(roofShape, { depth: 13, bevelEnabled: false });
roofGeo.translate(0, 0, -6.5);
const roof = new THREE.Mesh(roofGeo, lambert('#b5533c'));
roof.rotation.y = Math.PI / 2;
roof.position.y = 6;
house.add(body, roof);
const windowGeo = new THREE.BoxGeometry(1.6, 1.6, 0.2);
const windowMat = new THREE.MeshBasicMaterial({ color: '#ffd98a' });
const windows = new THREE.InstancedMesh(windowGeo, windowMat, 8);
const m = new THREE.Matrix4();
[-4, -1.3, 1.3, 4].forEach((x, i) => {
  windows.setMatrixAt(i, m.makeTranslation(x, 3.5, 4.05));
  windows.setMatrixAt(i + 4, m.makeTranslation(x, 3.5, -4.05));
});
house.add(windows);
scene.add(house);

// Stromy jako instancované meshe: 2 draw cally bez ohledu na počet
const trunks = new THREE.InstancedMesh(new THREE.CylinderGeometry(0.25, 0.35, 2, 6), lambert('#6b4a2f'), treeCount);
const crowns = new THREE.InstancedMesh(new THREE.ConeGeometry(1.6, 4, 7), lambert('#3f7d3a'), treeCount);
for (let i = 0; i < treeCount; i++) {
  const a = (i / treeCount) * Math.PI * 2 + (i % 3) * 0.3;
  const r = 18 + ((i * 37) % 40);
  const s = 0.7 + ((i * 13) % 10) / 15;
  const x = Math.cos(a) * r, z = Math.sin(a) * r;
  trunks.setMatrixAt(i, m.compose(new THREE.Vector3(x, s, z), new THREE.Quaternion(), new THREE.Vector3(s, s, s)));
  crowns.setMatrixAt(i, m.compose(new THREE.Vector3(x, 2 * s + 1.8 * s, z), new THREE.Quaternion(), new THREE.Vector3(s, s, s)));
}
scene.add(trunks, crowns);

const hud = document.getElementById('hud');
let scale = STEPS[0];

function resize() {
  const w = innerWidth, h = innerHeight;
  renderer.setPixelRatio(scale * Math.min(devicePixelRatio, 1));
  renderer.setSize(w, h, false);
  renderer.domElement.style.width = w + 'px';
  renderer.domElement.style.height = h + 'px';
  camera.aspect = w / h;
  camera.updateProjectionMatrix();
}
addEventListener('resize', resize);
resize();

const results = [];
let step = 0, stepStart = performance.now(), frames = [], last = performance.now(), hudAt = 0;

function finishStep(now) {
  const measured = frames.filter((f) => f.t >= stepStart + WARMUP_MS).map((f) => f.dt).sort((a, b) => a - b);
  const avg = measured.reduce((s, x) => s + x, 0) / Math.max(measured.length, 1);
  const p95 = measured[Math.floor(measured.length * 0.95)] ?? 0;
  const buf = new THREE.Vector2();
  renderer.getDrawingBufferSize(buf);
  results.push({ scale, res: `${buf.x}x${buf.y}`, fps: 1000 / avg, p95 });
  console.log('bench', JSON.stringify(results.at(-1)));
  step++;
  if (step < STEPS.length) {
    scale = STEPS[step];
    resize();
    stepStart = now;
    frames = [];
  } else {
    showResults();
  }
}

function showResults() {
  const lines = results.map((r) =>
    `scale ${r.scale.toFixed(2)}  ${r.res.padEnd(10)}  ${r.fps.toFixed(1).padStart(5)} fps  p95 ${r.p95.toFixed(1)} ms`);
  const text = `${glRenderer}\nAA: ${antialias ? 'ano' : 'ne'}, stromů: ${treeCount}\n\n${lines.join('\n')}`;
  document.querySelector('#result pre').textContent = text;
  document.getElementById('result').style.display = 'grid';
  window.benchResults = { glRenderer, antialias, treeCount, results };
  if (!fixedScale) renderer.setAnimationLoop(null);
}

renderer.setAnimationLoop((now) => {
  const dt = now - last;
  last = now;
  frames.push({ t: now, dt });

  const a = now / 6000;
  camera.position.set(Math.cos(a) * 34, 14, Math.sin(a) * 34);
  camera.lookAt(0, 3, 0);
  renderer.render(scene, camera);

  if (!fixedScale && now - stepStart >= WARMUP_MS + MEASURE_MS) finishStep(now);

  // HUD jen 2× za sekundu: DOM změna každý snímek stojí na ARM citelný čas
  if (now - hudAt < 500 || frames.length < 2) return;
  hudAt = now;
  const recent = frames.slice(-30);
  const fps = 1000 / (recent.reduce((s, f) => s + f.dt, 0) / recent.length);
  const i = renderer.info.render;
  hud.textContent =
    `${glRenderer}\nscale ${scale.toFixed(2)}  ${fps.toFixed(1)} fps\n` +
    `draw calls ${i.calls}  trojúhelníků ${i.triangles}\n` +
    (fixedScale ? 'volný běh' : `krok ${step + 1}/${STEPS.length}  ${Math.max(0, Math.ceil((stepStart + WARMUP_MS + MEASURE_MS - now) / 1000))} s`);
});
</script>
</body>
</html>
